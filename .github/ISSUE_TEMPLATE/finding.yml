name: Finding
description: Something observed that is wrong or surprising, with a reproduction
title: "Finding: <what is wrong>"
labels: ["type:finding"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands, run from the repository root.
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened, with the exit code. Facts only.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision and configuration
      description: "git rev-parse HEAD, build mode, assertions, ISE_C_COMPILER"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach files or link to `student/results/...`.
