name: Task
description: Planned work from the task register in docs/xpact-student-introduction.md
title: "<ID> - <short description>"
labels: ["type:task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What the task must achieve. Copy it from the task register if one applies.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The section of the student guide or the finding that motivates it.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checkable completion evidence.
      value: |
        - [ ]
        - [ ] Evidence in `student/results/<ID>-<words>/`
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Evidence / notes
